<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#080d18;color:#e8eefb;overflow:hidden;position:relative;
  }
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(760px 560px at 10% 4%,rgba(37,99,235,.42),transparent 62%),
      radial-gradient(620px 500px at 92% 96%,rgba(56,189,248,.26),transparent 64%);
  }
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(96,165,250,.09) 1px,transparent 1px),
      linear-gradient(90deg,rgba(96,165,250,.09) 1px,transparent 1px);
    background-size:58px 58px;
    mask-image:radial-gradient(circle at 40% 40%,#000,transparent 82%);
    -webkit-mask-image:radial-gradient(circle at 40% 40%,#000,transparent 82%);
  }
  .inner{position:relative;height:100%;padding:64px 74px;display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;align-items:center;gap:16px}
  .mark{
    width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(140deg,#3b82f6,#1d4ed8);font-family:'Fira Code',monospace;
    font-weight:600;font-size:22px;color:#fff;letter-spacing:-.5px;
    box-shadow:0 14px 34px -12px rgba(37,99,235,.95);
  }
  .brand{font-family:'Fira Code',monospace;font-size:21px;font-weight:500;color:#c9dbf3}
  .brand i{color:#5f7ba3;font-style:normal}
  h1{font-size:74px;line-height:1.02;letter-spacing:-3px;font-weight:800}
  h1 .g{background:linear-gradient(100deg,#60a5fa,#38bdf8 48%,#a5f3fc);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-family:'Fira Code',monospace;font-size:23px;color:#94a8c9;margin-top:22px;letter-spacing:-.3px}
  .role b{color:#38bdf8;font-weight:500}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .pills{display:flex;gap:11px}
  .pill{font-family:'Fira Code',monospace;font-size:17px;color:#a9c6e8;
    padding:9px 18px;border-radius:10px;background:rgba(96,165,250,.1);
    border:1px solid rgba(96,165,250,.26)}
  .pill.hot{background:rgba(37,99,235,.28);border-color:rgba(96,165,250,.5);color:#dbeafe}
  .url{font-family:'Fira Code',monospace;font-size:19px;color:#7f9bc0}
  .accentbar{position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,#3b82f6,#38bdf8 45%,#a5f3fc 70%,transparent)}
</style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="accentbar"></div>
  <div class="inner">
    <div class="row">
      <div class="mark">MS</div>
      <div class="brand">mahmoud<i>.dev</i></div>
    </div>
    <div>
      <h1>Mahmoud Saleh<br><span class="g">Backend Developer</span></h1>
      <div class="role"><b>const</b> stack = ["C#", ".NET", "SQL"]</div>
    </div>
    <div class="foot">
      <div class="pills">
        <span class="pill hot">C#</span>
        <span class="pill hot">.NET</span>
        <span class="pill">OOP</span>
        <span class="pill">Backend</span>
        <span class="pill">NEC Leader</span>
      </div>
      <div class="url">bodysale5678az-svg.github.io</div>
    </div>
  </div>
</body>
</html>
