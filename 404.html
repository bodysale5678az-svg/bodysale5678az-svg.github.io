<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Mahmoud Saleh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:#080d18;color:#e8eefb;text-align:center;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-20%;pointer-events:none;
    background:radial-gradient(680px 480px at 30% 10%,rgba(37,99,235,.22),transparent 62%),
               radial-gradient(620px 460px at 80% 90%,rgba(56,189,248,.14),transparent 62%);
  }
  .wrap{position:relative;max-width:540px}
  .code{
    font-family:'Fira Code',monospace;font-size:clamp(4rem,14vw,7rem);
    font-weight:600;letter-spacing:-4px;line-height:1;
    background:linear-gradient(100deg,#60a5fa,#38bdf8 50%,#a5f3fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:1.35rem;font-weight:700;margin:18px 0 10px;letter-spacing:-.02em}
  p{color:#94a8c9;font-size:.95rem;line-height:1.7;margin-bottom:28px}
  a.btn{
    display:inline-flex;align-items:center;gap:9px;
    padding:13px 24px;border-radius:12px;text-decoration:none;
    font-size:.9rem;font-weight:600;color:#f4f9ff;
    background:linear-gradient(140deg,#3b82f6,#1d4ed8);
    border:1px solid rgba(147,197,253,.3);
    box-shadow:0 12px 30px -14px rgba(37,99,235,1);
    transition:transform .2s ease;
  }
  a.btn:hover{transform:translateY(-2px)}
  .msg{
    font-family:'Fira Code',monospace;font-size:.78rem;color:#5a7396;
    margin-top:26px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have been moved.<br>Let's get you back on track.</p>
    <a class="btn" href="/">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to portfolio
    </a>
    <div class="msg">// error 404 — route not found</div>
  </div>
</body>
</html>
